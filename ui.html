<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; --bg:#f7f7f6; --panel:#fff; --text:#111111; --muted:#666666; --line:#e7e5e1; --soft:#f3f2ef; --blue:#111111; --blue-soft:#f3f2ef; --red:#b42318; --red-soft:#f7e7e4; --amber:#9a6700; --amber-soft:#f4ead2; --green:#276749; --green-soft:#e5f0e9; --shadow:0 1px 2px rgba(15,23,42,.08); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-size:12px} button,select,input{font:inherit} button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column;background:var(--panel)}.topbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;font-weight:750;font-size:13px}.logo{width:76px;height:20px;display:block;object-fit:contain;object-position:left center}.icon-btn{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:6px}.content{padding:12px;overflow:auto;flex:1}.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}.step{display:grid;justify-items:center;gap:5px;color:var(--muted);font-size:10px;text-align:center;position:relative}.step:before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:1px;background:#cbd5e1;z-index:0}.step:first-child:before{display:none}.step-dot{width:22px;height:22px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;display:grid;place-items:center;font-weight:750;color:var(--muted);z-index:1}.step.active{color:#111111;font-weight:700}.step.active .step-dot,.step.done .step-dot{background:#0a0a0a;border-color:#0a0a0a;color:#fff}.step.done{color:#334155}h1{font-size:18px;line-height:1.2;margin:0 0 6px}h2{font-size:15px;line-height:1.25;margin:0}p{margin:0}.muted{color:var(--muted)}.strong{font-weight:750}.section{margin-bottom:14px}.section-title{font-size:12px;font-weight:750;margin-bottom:8px}.card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:11px;box-shadow:none}.callout{border-radius:8px;background:var(--blue-soft);color:#1e3a8a;padding:11px;line-height:1.45}.success-callout{border-radius:8px;background:var(--green-soft);color:#14532d;padding:11px;line-height:1.45}.warning-callout{border-radius:8px;background:var(--red-soft);color:#7f1d1d;padding:11px;line-height:1.45}.primary{width:100%;height:40px;border:0;border-radius:7px;background:#0a0a0a;color:#fff;font-weight:750;box-shadow:none}.primary:disabled{background:#cbd5e1;cursor:not-allowed}.secondary{height:32px;border:1px solid var(--line);background:#fff;color:#334155;border-radius:6px;font-weight:650}.button-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.two-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:7px;padding:5px 8px;font-weight:700;line-height:1;white-space:nowrap}.pill.must,.pill.high{color:var(--red);background:var(--red-soft)}.pill.should,.pill.medium{color:var(--amber);background:var(--amber-soft)}.pill.info,.pill.low{color:#111111;background:var(--blue-soft)}.pill.pass,.pill.good{color:var(--green);background:var(--green-soft)}.pill.neutral{color:#475569;background:var(--soft)}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;color:#334155;font-weight:650}.empty-hero{min-height:188px;display:grid;place-items:center;text-align:center;gap:12px}.empty-icon{width:58px;height:58px;border:1px dashed #94a3b8;border-radius:10px;display:grid;place-items:center;color:#64748b;font-size:22px;background:#f8fafc}.mode-card{display:grid;grid-template-columns:28px 28px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}.mode-card.active{border-color:#0a0a0a;box-shadow:none;background:#f7f7f6}.mode-card.disabled{opacity:.55;cursor:not-allowed;background:#fafafa}.mode-card.disabled .radio{background:#f1f5f9}.soon-badge{display:inline-flex;margin-left:6px;border-radius:999px;background:#f3f2ef;color:#475569;font-size:9px;font-weight:800;padding:3px 6px;vertical-align:middle}.radio{width:18px;height:18px;border-radius:999px;border:2px solid #cbd5e1;display:grid;place-items:center}.active .radio{border-color:#0a0a0a}.active .radio:after{content:"";width:8px;height:8px;border-radius:999px;background:#0a0a0a}.mode-icon{color:#111111;font-size:18px;text-align:center}.field{margin-bottom:10px}.field label{display:block;color:#334155;font-weight:700;margin-bottom:6px}select,input[type="text"],input[type="password"]{width:100%;border:1px solid var(--line);border-radius:7px;height:34px;padding:0 9px;background:#fff;color:var(--text)}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.check-row{display:flex;align-items:center;gap:7px;color:#334155;line-height:1.25}input[type="checkbox"]{width:15px;height:15px;accent-color:#111111}.segmented{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:7px;overflow:hidden}.segment{border:0;background:#fff;padding:8px 4px;border-right:1px solid var(--line);color:#334155}.segment:last-child{border-right:0}.segment.active{background:#0a0a0a;color:#fff;font-weight:750}.selected-frame{display:flex;justify-content:space-between;align-items:center;gap:10px}.frame-thumb{width:34px;height:28px;border:1px solid var(--line);border-radius:5px;background:linear-gradient(#e2e8f0 7px,transparent 7px) 6px 6px/18px 6px no-repeat,#f8fafc}.inline{display:flex;align-items:center;gap:8px}.progress{height:9px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin:14px 0}.progress span{display:block;width:var(--progress);height:100%;background:#0a0a0a;transition:width .25s ease}.run-step{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;margin:12px 0}.status-dot{width:18px;height:18px;border-radius:999px;border:2px solid #cbd5e1}.status-dot.done{background:#16a34a;border-color:#16a34a}.status-dot.active{border-color:#0a0a0a;box-shadow:0 0 0 4px #dbeafe}.score-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.score{font-size:26px;line-height:1;font-weight:850;margin-top:3px}.review-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0;border-bottom:1px solid var(--line)}.review-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:8px 2px;color:#475569}.review-tabs button.active{color:#111111;border-bottom-color:#111111;font-weight:750}.finding{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:9px;background:#fff}.finding.must{border-color:#fecaca;background:#fffafa}.finding.should{border-color:#fde68a;background:#fffdf4}.finding-head{display:flex;justify-content:space-between;gap:8px;align-items:start}.finding-title{font-weight:800;font-size:13px;margin-bottom:5px}.mini-chip{color:#475569;background:#eef2f7;padding:4px 7px;border-radius:7px;font-weight:650}.category-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}.detail-back{border:0;background:transparent;color:#111111;font-weight:750;padding:0;margin-bottom:14px}.evidence-box{border:1px solid var(--line);border-radius:8px;background:#f8fafc;padding:10px;margin:8px 0 14px}.checklist label{display:flex;align-items:start;gap:8px;margin:8px 0;color:#475569}table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;font-size:10.5px}th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 5px;text-align:center;vertical-align:middle}th:first-child,td:first-child{text-align:left;font-weight:750}tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}.hidden{display:none}
  </style>
</head>

ntent" id="view"></main></div>
  <script>
    const state={screen:"empty",selection:null,audit:null,progress:0,activeStep:0,detail:null,strictness:"Balanced",auditMode:"local",productType:"SaaS product (web app)",userRole:"End user (customer)",apiConnected:false,apiMessage:"No API key saved yet.",apiBusy:false,cloudCredits:3};
    const runSteps=[["Reading structure","Mapping layers and text"],["Detecting patterns","Finding tables, forms, settings, and actions"],["Checking hierarchy","Reviewing visual priority and CTAs"],["Reviewing states","Checking empty, loading, error, and permission states"],["Preparing review","Grouping and prioritizing insights"]];
    const stepNames=["Select frame","Configure review","Review","Summary"];
    function send(type,payload={}){parent.postMessage({pluginMessage:{type,...payload}},"*")} function refreshSelection(){send("get-selection")} function clearSelection(){state.selection={hasSelection:false,selectionCount:0,frameName:"No frame selected"};state.audit=null;state.detail=null;state.screen="empty";send("clear-selection");render()} function hasSelection(){return state.selection&&state.selection.hasSelection}
    function stepIndex(){if(!hasSelection())return 1;if(["mode","configure","api","cloud","running","fallback"].includes(state.screen))return 2;if(["findings","detail","states"].includes(state.screen))return 3;if(state.screen==="report")return 4;return 1}
    function modeLabel(mode=state.auditMode){if(mode==="api")return"Use my API key";if(mode==="cloud")return"Meyar Cloud";return"Free local"} function modeMessage(){if(state.auditMode==="api")return"AI review uses your own OpenAI key stored locally on this device.";if(state.auditMode==="cloud")return"Meyar Cloud is coming soon and is not available in this local version yet.";return"Free local stays inside Figma. Your design is not sent to any external service."}
    function renderStepper(){const current=stepIndex();document.getElementById("stepper").innerHTML=stepNames.map((name,index)=>{const number=index+1;const cls=number<current?"done":number===current?"active":"";return `<div class="step ${cls}"><div class="step-dot">${number<current?"✓":number}</div><div>${name}</div></div>`}).join("")}
    function setScreen(screen){state.screen=screen;state.detail=null;render()} function setMode(mode){if(mode==="cloud")return;state.auditMode=mode;render()} function setStrictness(value){state.strictness=value;render()} function severityLabel(severity){return severity==="must"?"High":severity==="should"?"Medium":"Low"} function severityClass(severity){return severity==="must"?"high":severity==="should"?"medium":"low"} function getFinding(index){return state.audit&&state.audit.findings?state.audit.findings[index]:null} function openFinding(index){const finding=getFinding(index);if(finding){state.detail=finding;state.screen="detail";render()}} function addFindingNote(index){const finding=getFinding(index);if(finding)send("create-note",{finding})}
    function continueFromMode(){if(state.auditMode==="api"){setScreen("api")}else setScreen("configure")}
    function apiKeyValue(){const input=document.getElementById("apiKeyInput");return input?input.value.trim():""} function saveApiKey(){const apiKey=apiKeyValue();state.apiBusy=true;state.apiMessage="Saving key...";render();send("save-api-key",{apiKey})} function testApiKey(){const apiKey=apiKeyValue();state.apiBusy=true;state.apiMessage="Testing key...";render();send("test-api-key",{apiKey})} function clearApiKey(){state.apiBusy=true;state.apiMessage="Removing key...";render();send("clear-api-key")} function runAudit(){if(!hasSelection())return;state.screen="running";state.progress=8;state.activeStep=0;render();let tick=0;const timer=setInterval(()=>{tick+=1;state.progress=Math.min(92,8+tick*18);state.activeStep=Math.min(4,Math.floor(tick*1.05));render();if(tick>=5){clearInterval(timer);send("run-audit",{config:{strictness:state.strictness,frameName:state.selection.frameName,auditMode:state.auditMode,productType:state.productType,userRole:state.userRole}})}},380)}
    function renderEmpty(){return `<div class="empty-hero"><div class="empty-icon">▣</div><div><h1>Select a frame to start</h1><p class="muted" style="line-height:1.45">Choose a frame on your canvas to audit its UI design for clarity, completeness, and best practices.</p></div></div><div class="section"><div class="section-title">Supported screen types</div><div class="chips">${["SaaS app","Landing page","Dashboard","Settings","Form","Table"].map(item=>`<span class="chip">${item}</span>`).join("")}</div></div><button class="primary" disabled>Start review</button>`}
    function renderMode(){const option=(mode,title,body,icon,disabled=false)=>`<button class="mode-card ${state.auditMode===mode?"active":""} ${disabled?"disabled":""}" ${disabled?"disabled":`onclick="setMode('${mode}')"`}><span class="radio"></span><span class="mode-icon">${icon}</span><span style="text-align:left"><span class="strong">${title}${disabled?"<span class='soon-badge'>Soon</span>":""}</span><br><span class="muted">${body}</span></span></button>`;return `<div class="section"><h1>Choose review mode</h1><p class="muted">Select how you want to run the audit.</p></div>${option("local","Free local","Fast private checks. No AI. No cost.","▣")}${option("api","Use my API key","AI review with your own OpenAI key. Stored locally.","⚿")}${option("cloud","Meyar Cloud","Hosted AI reviews from Meyar will be available soon.","☁",true)}<button class="primary" style="margin-top:16px" onclick="continueFromMode()">Continue</button>`}
    function selectedFrameCard(){const selection=state.selection||{};return `<div class="card selected-frame"><div class="inline"><div class="frame-thumb"></div><div><div class="muted">Selected frame</div><div class="strong">${selection.frameName||"No frame selected"}</div></div></div><button class="secondary" onclick="refreshSelection()">Change</button></div>`}
    function renderConfigure(){const checks=["UX clarity & hierarchy","Missing states","Handoff risks","Consistency & patterns","Accessibility basic"];return `<button class="detail-back" onclick="setScreen('mode')">&lt;- Back to review modes</button><div class="section"><h1>Configure review</h1></div><div class="section">${selectedFrameCard()}</div><div class="field-grid"><div class="field"><label>Product type</label><select onchange="state.productType=this.value"><option>SaaS product (web app)</option><option>Landing page</option><option>Dashboard</option><option>Settings</option><option>Form-heavy flow</option><option>Data table</option></select><div class="muted" style="margin-top:4px">Landing page also supported.</div></div><div class="field"><label>User role</label><select onchange="state.userRole=this.value"><option>End user (customer)</option><option>Workspace admin</option><option>Buyer / evaluator</option><option>Product manager</option><option>Support agent</option><option>Developer</option></select></div></div><div class="section"><div class="section-title">Audit lenses</div><div class="check-grid">${checks.map(item=>`<label class="check-row"><input type="checkbox" checked> ${item}</label>`).join("")}</div></div><div class="section"><div class="section-title">Strictness</div><div class="segmented">${["Light","Balanced","Strict"].map(value=>`<button class="segment ${state.strictness===value?"active":""}" onclick="setStrictness('${value}')">${value}${value==="Balanced"?"<br><span style='font-size:9px'>Recommended</span>":""}</button>`).join("")}</div></div><div class="callout section"><strong>${modeLabel()}</strong><br>${modeMessage()}</div><button class="primary" onclick="runAudit()">Start review</button>`}
    function renderApiSetup(){return `<button class="detail-back" onclick="setScreen('mode')">&lt;- Choose another mode</button><div class="section"><div class="inline" style="justify-content:space-between"><h1>Use my API key</h1><span class="pill ${state.apiConnected?"pass":"neutral"}">${state.apiConnected?"Connected":"Not connected"}</span></div></div><div class="field"><label>OpenAI API key</label><input id="apiKeyInput" type="password" placeholder="sk-..." autocomplete="off"></div><div class="button-row section"><button class="primary" onclick="saveApiKey()" ${state.apiBusy?"disabled":""}>Save key</button><button class="secondary" onclick="testApiKey()" ${state.apiBusy?"disabled":""}>Test key</button><button class="secondary" onclick="clearApiKey()" ${state.apiBusy?"disabled":""}>Clear</button></div><div class="${state.apiConnected?"success-callout":"callout"} section"><strong>${state.apiConnected?"Ready for AI review":"Stored locally"}</strong><br>${state.apiMessage||"Your key is stored locally in Figma on this device. Meyar does not receive your key."}</div><div class="callout section">When you start a review, Meyar Clarity sends only a structured summary of the selected frame to OpenAI using your key. If AI fails, Free local review still runs.</div><button class="primary" onclick="setScreen('configure')" ${!state.apiConnected?"disabled":""}>Continue to configure</button>`}
    function renderCloudSetup(){return `<button class="detail-back" onclick="setScreen('mode')">&lt;- Choose another mode</button><div class="section"><h1>Meyar Cloud</h1><p class="muted">Hosted AI reviews are coming soon.</p></div><div class="callout section"><strong>Coming soon</strong><br>This option is not available in the local plugin yet. For now, use Free local or Use my API key.</div><button class="primary" onclick="setScreen('mode')">Back to review modes</button>`}
    function renderRunning(){return `<div class="section"><div class="inline" style="justify-content:space-between"><div><h1>Reviewing design...</h1><p class="muted">Reviewing ${state.selection?state.selection.frameName:"selected frame"}.</p></div><span class="pill info">${modeLabel()}</span></div></div><div class="progress" style="--progress:${state.progress}%"><span></span></div>${runSteps.map((step,index)=>{const cls=index<state.activeStep?"done":index===state.activeStep?"active":"";const status=index<state.activeStep?"Done":index===state.activeStep?"In progress":"Pending";return `<div class="run-step"><span class="status-dot ${cls}"></span><div><div class="strong">${step[0]}</div><div class="muted">${step[1]}</div></div><span class="muted">${status}</span></div>`}).join("")}<div class="callout" style="margin-top:16px"><strong>Usually takes 10-20 seconds.</strong><br>You can keep this panel open while the audit runs.</div>`}
    function renderReview(){if(!state.audit)return `<div class="callout">Start a review first to see findings.</div>`;const findings=state.audit.findings||[];return `<div class="score-grid section"><div class="card"><div class="muted">Readiness</div><div class="score" style="color:var(--green)">${state.audit.score}<span class="muted" style="font-size:13px"> / 100</span></div></div><div class="card"><div class="muted">Complexity</div><div style="margin-top:8px"><span class="pill ${state.audit.complexity==="High"||state.audit.complexity==="Critical"?"must":"medium"}">${state.audit.complexity}</span></div></div><div class="card"><div class="muted">Mode</div><div style="margin-top:8px"><span class="pill info">${modeLabel()}</span></div></div></div><div class="section"><div class="section-title">Review findings</div><p class="muted" style="line-height:1.45">Each finding includes the issue, why it matters, and the recommended improvement.</p></div>${findings.map((finding,index)=>`<article class="finding ${finding.severity}"><div class="finding-head"><div><div class="finding-title">${finding.title}</div><div class="category-row"><span class="mini-chip">${finding.category}</span><span class="mini-chip">${finding.layerName}</span></div></div><span class="pill ${severityClass(finding.severity)}">${severityLabel(finding.severity)}</span></div><div class="evidence-box"><div class="section-title">Recommendation</div><p style="line-height:1.45">${finding.recommendation}</p></div><div class="muted" style="line-height:1.45;margin-bottom:10px"><strong>Why it matters:</strong> ${finding.why}</div><div class="button-row"><button class="secondary" onclick="send('show-layer', { nodeId: '${finding.layerId}' })">Show layer</button><button class="secondary" onclick="addFindingNote(${index})">Add note</button><button class="secondary" onclick="openFinding(${index})">Open</button></div></article>`).join("")}<div class="two-actions" style="margin-top:8px"><button class="secondary" onclick="setScreen('states')">Review states</button><button class="primary" onclick="setScreen('report')">Continue to summary</button></div>`}
    function renderDetail(){const finding=state.detail;if(!finding)return renderReview();return `<button class="detail-back" onclick="state.detail=null; state.screen='findings'; render()">&lt;- Back to findings</button><div class="section"><div class="finding-head"><h1>${finding.title}</h1><span class="pill ${severityClass(finding.severity)}">${severityLabel(finding.severity)}</span></div><div class="category-row"><span class="mini-chip">${finding.category}</span><span class="mini-chip">Confidence ${finding.confidence}</span><span class="mini-chip">${finding.id}</span></div></div><div class="section"><div class="section-title">Evidence</div><div class="evidence-box">${finding.evidence.map(item=>`<div style="margin:5px 0">${item}</div>`).join("")}</div></div><div class="section"><div class="section-title">Why it matters</div><p class="muted" style="line-height:1.55">${finding.why}</p></div><div class="section"><div class="section-title">Recommended design response</div><p style="line-height:1.55">${finding.recommendation}</p></div><div class="section checklist"><div class="section-title">Checklist</div><label><input type="checkbox"> Make primary action visually distinct</label><label><input type="checkbox"> Use clear, action-oriented labels</label><label><input type="checkbox"> Reduce competing actions or use tertiary style</label></div><div class="two-actions"><button class="secondary" onclick="send('show-layer', { nodeId: '${finding.layerId}' })">Show layer</button><button class="secondary" onclick="send('create-note', { finding: state.detail })">Add annotation</button></div><button class="primary" style="margin-top:8px" onclick="state.detail=null; state.screen='findings'; render()">Mark resolved</button>`}
    function renderStates(){if(!state.audit)return `<div class="callout">Start a review first to review missing states.</div>`;const pillClass=value=>value==="Present"?"pass":value==="Missing"?"must":"should";return `<div class="section"><h1>Missing states</h1><p class="muted">Check common UI states across different screen types.</p></div><table><thead><tr><th>State</th><th>Table</th><th>Form</th><th>Billing</th></tr></thead><tbody>${state.audit.states.map(row=>`<tr><td>${row.name}</td><td><span class="pill ${pillClass(row.table)}">${row.table}</span></td><td><span class="pill ${pillClass(row.form)}">${row.form}</span></td><td><span class="pill ${pillClass(row.billing)}">${row.billing}</span></td></tr>`).join("")}</tbody></table><div class="callout section" style="margin-top:14px"><strong>Why this matters</strong><br>Essential states prevent user errors, build trust, and make handoff more complete.</div><button class="primary" onclick="setScreen('report')">Generate review summary</button>`}
    function renderReport(){if(!state.audit)return `<div class="callout">Start a review first to generate a report.</div>`;const findings=state.audit.findings||[];return `<div class="section"><h1>Report preview</h1><p class="muted">Review the summary before creating a report frame.</p></div><div class="card section"><div class="selected-frame"><div><div class="strong">${state.audit.summary.frameName}</div><div class="muted">${state.productType}</div></div><div><span class="pill pass">Score ${state.audit.score}</span></div><div><span class="pill info">${modeLabel()}</span></div></div></div><div class="section"><div class="section-title">Top issues</div>${findings.slice(0,5).map((finding,index)=>`<div class="inline" style="justify-content:space-between;margin:7px 0"><span>${index+1}. ${finding.title}</span><span class="pill ${severityClass(finding.severity)}">${severityLabel(finding.severity)}</span></div>`).join("")}</div><div class="callout section"><strong>Missing states summary</strong><br>Review missing, unclear, and present states before handoff.</div><div class="two-actions"><button class="primary" onclick="send('create-report', { data: state.audit })">Summary frame</button><button class="secondary">Copy summary</button></div>`}
    function renderFallback(){const message=state.audit&&state.audit.aiMessage?state.audit.aiMessage:"AI review could not be completed.";return `<div class="warning-callout section"><h1 style="margin-bottom:6px">AI review unavailable</h1><p>We completed a Free local review instead.</p></div><button class="primary section" onclick="state.auditMode='local'; setScreen('findings')">View local review</button><div class="section-title">Details</div><div class="finding must"><div class="finding-head"><div><div class="finding-title">Use my API key needs attention</div><div class="muted">${message}</div></div><button class="secondary" onclick="setScreen('api')">Fix key</button></div></div><div class="finding should"><div class="finding-head"><div><div class="finding-title">Common checks</div><div class="muted">Make sure the key is active, has billing enabled, and that Figma can access api.openai.com.</div></div><button class="secondary" onclick="state.auditMode='api'; setScreen('configure')">Retry</button></div></div>`}
    function render(){renderStepper();const view=document.getElementById("view");if(!hasSelection()){state.screen="empty";view.innerHTML=renderEmpty();return}if(state.screen==="empty")state.screen="mode";if(state.screen==="mode")view.innerHTML=renderMode();if(state.screen==="configure")view.innerHTML=renderConfigure();if(state.screen==="api")view.innerHTML=renderApiSetup();if(state.screen==="cloud")view.innerHTML=renderCloudSetup();if(state.screen==="running")view.innerHTML=renderRunning();if(state.screen==="findings")view.innerHTML=renderReview();if(state.screen==="detail")view.innerHTML=renderDetail();if(state.screen==="states")view.innerHTML=renderStates();if(state.screen==="report")view.innerHTML=renderReport();if(state.screen==="fallback")view.innerHTML=renderFallback()}
    window.onmessage=event=>{const message=event.data.pluginMessage;if(!message)return;if(message.type==="selection"){const hadSelection=hasSelection();state.selection=message.payload;if(!hadSelection&&hasSelection())state.screen="mode";render()}if(message.type==="audit-result"){state.audit=message.payload;state.progress=100;if(state.audit&&state.audit.aiUnavailable&&state.auditMode!=="local")state.screen="fallback";else state.screen="findings";render()}if(message.type==="api-key-status"){state.apiBusy=false;state.apiConnected=!!message.connected;state.apiMessage=message.message||"";render()}};render();
  </script>
</body>
</html>
