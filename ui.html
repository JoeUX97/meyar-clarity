<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #111827;
      --muted: #667085;
      --line: #e5e7eb;
      --soft: #f1f5f9;
      --blue: #1769e0;
      --blue-soft: #eaf2ff;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --green: #15803d;
      --green-soft: #dcfce7;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
    }

    button, select, input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .logo {
      width: 18px;
      height: 18px;
      border: 2px solid var(--blue);
      border-radius: 50%;
      position: relative;
    }

    .logo:after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      right: -3px;
      top: 2px;
      background: var(--panel);
      border: 2px solid var(--blue);
      border-radius: 50%;
    }

    .ghost-icon {
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 10px 4px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
      font-weight: 650;
    }

    .content {
      padding: 14px;
      overflow: auto;
      flex: 1;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .selection {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 12px;
      align-items: center;
    }

    .preview {
      height: 78px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, #eef2f7 8px, transparent 8px) 10px 10px / 36px 10px no-repeat,
        linear-gradient(90deg, #dbeafe 42px, #eff6ff 42px) 10px 28px / 78px 8px no-repeat,
        linear-gradient(90deg, #e5e7eb 28px, transparent 28px) 10px 44px / 70px 8px no-repeat,
        linear-gradient(90deg, #e5e7eb 60px, transparent 60px) 10px 60px / 86px 8px no-repeat,
        #f8fafc;
      box-shadow: inset 0 0 0 6px #fff;
    }

    .muted { color: var(--muted); }
    .strong { font-weight: 700; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip, .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 7px;
      padding: 5px 8px;
      font-weight: 650;
      line-height: 1;
    }

    .chip {
      background: var(--soft);
      color: #334155;
    }

    .chip.blue { background: var(--blue-soft); color: var(--blue); }
    .chip.green { background: var(--green-soft); color: var(--green); }
    .chip.amber { background: var(--amber-soft); color: var(--amber); }
    .chip.purple { background: #f3e8ff; color: #7e22ce; }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 9px 0;
      color: #334155;
    }

    input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--blue);
    }

    .field {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .field label {
      color: #475569;
    }

    select, input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      height: 30px;
      padding: 0 8px;
      background: #fff;
      color: var(--text);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }

    .segment {
      border: 0;
      background: #fff;
      padding: 8px 4px;
      cursor: pointer;
      border-right: 1px solid var(--line);
    }

    .segment:last-child { border-right: 0; }
    .segment.active {
      background: var(--blue);
      color: #fff;
      font-weight: 700;
    }

    .primary {
      width: 100%;
      height: 40px;
      border: 0;
      border-radius: 7px;
      background: var(--blue);
      color: #fff;
      font-weight: 750;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .primary:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .secondary {
      height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 650;
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 8px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .score {
      font-size: 31px;
      line-height: 1;
      font-weight: 800;
      margin: 4px 0 8px;
    }

    .meter {
      height: 8px;
      border-radius: 99px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      width: var(--value);
      background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e);
    }

    .finding {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fff;
    }

    .finding.must { border-color: #fecaca; background: #fffafa; }
    .finding.should { border-color: #fde68a; background: #fffdf4; }

    .finding-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: start;
    }

    .finding-title {
      font-weight: 750;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .pill.must { color: var(--red); background: var(--red-soft); }
    .pill.should { color: var(--amber); background: var(--amber-soft); }
    .pill.info { color: var(--blue); background: var(--blue-soft); }
    .pill.pass { color: var(--green); background: var(--green-soft); }
    .pill.neutral { color: #475569; background: var(--soft); }

    .category-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0 8px;
    }

    .mini-chip {
      color: #475569;
      background: #eef2f7;
      padding: 4px 7px;
      border-radius: 7px;
      font-weight: 650;
    }

    .result-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin: 12px 0;
    }

    .result-tabs button {
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      padding: 8px 2px;
      color: #475569;
      cursor: pointer;
    }

    .result-tabs button.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
      font-weight: 700;
    }

    .progress-wrap {
      padding-top: 20px;
    }

    .progress {
      height: 9px;
      border-radius: 99px;
      background: #e5e7eb;
      overflow: hidden;
      margin: 22px 0;
    }

    .progress span {
      display: block;
      width: var(--progress);
      height: 100%;
      background: var(--blue);
      transition: width 0.25s ease;
    }

    .step {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: start;
      margin: 18px 0;
    }

    .dot {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      margin-top: 1px;
    }

    .dot.done {
      background: #16a34a;
      border-color: #16a34a;
      position: relative;
    }

    .dot.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 5px #dbeafe;
    }

    .detail-back {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-weight: 700;
      padding: 0;
      margin-bottom: 18px;
      cursor: pointer;
    }

    .evidence-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      padding: 10px;
      margin: 8px 0 14px;
    }

    .checklist label {
      display: flex;
      align-items: start;
      gap: 8px;
      margin: 8px 0;
      color: #475569;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      font-size: 11px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 10px 6px;
      text-align: center;
      vertical-align: middle;
    }

    th:first-child, td:first-child {
      text-align: left;
      font-weight: 700;
    }

    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }

    .callout {
      border-radius: 8px;
      background: var(--blue-soft);
      color: #1e3a8a;
      padding: 12px;
      margin: 18px 0;
      line-height: 1.45;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="logo"></span>Meyar Clarity</div>
      <button class="ghost-icon" title="Refresh selection" onclick="refreshSelection()">R</button>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="audit" onclick="setTab('audit')">Audit</button>
      <button class="tab" data-tab="findings" onclick="setTab('findings')">Findings</button>
      <button class="tab" data-tab="states" onclick="setTab('states')">States</button>
      <button class="tab" data-tab="report" onclick="setTab('report')">Report</button>
    </nav>

    <main class="content">
      <section id="audit-view"></section>
      <section id="running-view" class="hidden"></section>
      <section id="findings-view" class="hidden"></section>
      <section id="detail-view" class="hidden"></section>
      <section id="states-view" class="hidden"></section>
      <section id="report-view" class="hidden"></section>
    </main>
  </div>

  <script>
    const state = {
      tab: "audit",
      selection: null,
      audit: null,
      progress: 0,
      activeStep: 0,
      detail: null,
      strictness: "Detailed"
    };

    const steps = [
      ["Reading structure", "Mapping layers, text, and components"],
      ["Detecting patterns", "Finding tables, forms, settings, and actions"],
      ["Checking hierarchy", "Reviewing visual priority and CTAs"],
      ["Reviewing SaaS heuristics", "Applying product design guidelines"],
      ["Preparing findings", "Grouping and prioritizing insights"]
    ];

    function send(type, payload = {}) {
      parent.postMessage({ pluginMessage: { type, ...payload } }, "*");
    }

    function refreshSelection() {
      send("get-selection");
    }

    function setTab(tab) {
      state.tab = tab;
      state.detail = null;
      render();
    }

    function showDetail(finding) {
      state.detail = finding;
      render();
    }

    function getFinding(index) {
      return state.audit && state.audit.findings ? state.audit.findings[index] : null;
    }

    function openFinding(index) {
      const finding = getFinding(index);
      if (finding) showDetail(finding);
    }

    function addFindingNote(index) {
      const finding = getFinding(index);
      if (finding) send("create-note", { finding });
    }

    function setStrictness(value) {
      state.strictness = value;
      render();
    }

    function runAudit() {
      if (!state.selection || !state.selection.hasSelection) return;
      state.tab = "running";
      state.progress = 8;
      state.activeStep = 0;
      render();

      let tick = 0;
      const timer = setInterval(() => {
        tick += 1;
        state.progress = Math.min(92, 8 + tick * 18);
        state.activeStep = Math.min(4, Math.floor(tick * 1.05));
        render();

        if (tick >= 5) {
          clearInterval(timer);
          send("run-audit", {
            config: {
              strictness: state.strictness,
              frameName: state.selection.frameName
            }
          });
        }
      }, 380);
    }

    function severityLabel(severity) {
      return severity === "must" ? "Must fix" : severity === "should" ? "Should fix" : "Consider";
    }

    function patternClass(index) {
      return ["blue", "green", "amber", "purple"][index % 4];
    }

    function renderTabs() {
      document.querySelectorAll(".tab").forEach((tab) => {
        const key = tab.getAttribute("data-tab");
        const activeKey = state.tab === "running" ? "audit" : state.tab;
        tab.classList.toggle("active", key === activeKey);
      });
    }

    function renderAudit() {
      const selection = state.selection || {};
      const patterns = selection.patterns || [];
      document.getElementById("audit-view").innerHTML = `
        <div class="section">
          <div class="section-title">Selected frame</div>
          <div class="selection">
            <div class="preview"></div>
            <div>
              <div class="strong" style="font-size:14px">${selection.frameName || "No frame selected"}</div>
              <div class="muted" style="margin-top:4px">${selection.hasSelection ? `${selection.width} x ${selection.height}` : "Select a frame in Figma"}</div>
              <div class="muted" style="margin-top:4px">${selection.hasSelection ? `${selection.layers} layers` : "Meyar Clarity audits product screens"}</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Detected patterns</div>
          <div class="chips">
            ${patterns.map((pattern, index) => `<span class="chip ${patternClass(index)}">${pattern}</span>`).join("") || `<span class="chip">Waiting for selection</span>`}
          </div>
        </div>

        <div class="section">
          <div class="section-title">Audit lens</div>
          ${["Clarity", "Hierarchy", "Density", "Forms & tables", "States", "Consistency", "Accessibility basics"].map((item) => `
            <label class="check-row"><input type="checkbox" checked /> ${item}</label>
          `).join("")}
        </div>

        <div class="section">
          <div class="section-title">Context</div>
          <div class="field"><label>Product type</label><select><option>Admin / Billing</option><option>Landing page</option><option>CRM</option><option>Analytics</option><option>Workflow tool</option><option>Dashboard</option><option>Settings</option><option>Onboarding</option><option>Marketplace</option></select></div>
          <div class="field"><label>User role</label><select><option>Workspace admin</option><option>Buyer / evaluator</option><option>End user</option><option>Founder</option><option>Product manager</option><option>Product designer</option><option>Marketing manager</option><option>Manager</option><option>Analyst</option><option>Support agent</option><option>Developer</option><option>Contributor</option></select></div>
          <div class="section-title" style="margin-top:12px">Strictness</div>
          <div class="segmented">
            ${["Fast pass", "Detailed", "Handoff-ready"].map((value) => `<button class="segment ${state.strictness === value ? "active" : ""}" onclick="setStrictness('${value}')">${value}</button>`).join("")}
          </div>
        </div>

        <button class="primary" onclick="runAudit()" ${selection.hasSelection ? "" : "disabled"}>Run audit</button>
      `;
    }

    function renderRunning() {
      document.getElementById("running-view").innerHTML = `
        <div class="progress-wrap">
          <h2 style="font-size:18px;margin:0 0 8px">Running audit...</h2>
          <p class="muted" style="font-size:13px;line-height:1.45;margin:0">Analyzing the selected frame with B2B SaaS clarity heuristics.</p>
          <div class="progress" style="--progress:${state.progress}%"><span></span></div>
          ${steps.map((step, index) => {
            const status = index < state.activeStep ? "done" : index === state.activeStep ? "active" : "";
            return `
              <div class="step">
                <span class="dot ${status}"></span>
                <div>
                  <div class="strong">${step[0]}</div>
                  <div class="muted" style="margin-top:3px">${step[1]}</div>
                </div>
                <span class="muted">${index < state.activeStep ? "done" : index === state.activeStep ? "..." : ""}</span>
              </div>
            `;
          }).join("")}
          <div class="callout"><strong>Almost there...</strong><br />This local version uses realistic mock findings so we can test the plugin workflow first.</div>
        </div>
      `;
    }

    function renderFindings() {
      if (!state.audit) {
        document.getElementById("findings-view").innerHTML = `<div class="callout">Run an audit first to see findings.</div>`;
        return;
      }

      const findings = state.audit.findings;
      document.getElementById("findings-view").innerHTML = `
        <div class="score-grid">
          <div class="card">
            <div class="muted">Clarity Score</div>
            <div class="score">${state.audit.score}<span class="muted" style="font-size:14px;font-weight:500"> / 100</span></div>
            <div class="meter" style="--value:${state.audit.score}%"><span></span></div>
            <div class="muted" style="margin-top:8px">${state.audit.mode || "Audit"}${state.audit.backendMessage ? ` - ${state.audit.backendMessage}` : ""}</div>
          </div>
          <div class="card">
            <div class="muted">Complexity</div>
            <div style="margin:9px 0"><span class="pill ${state.audit.complexity === "High" || state.audit.complexity === "Critical" ? "must" : "should"}">${state.audit.complexity}</span></div>
            <div class="strong">${findings.length} findings</div>
          </div>
        </div>

        <div class="result-tabs">
          <button class="active">Must fix <span class="pill must">${findings.filter((f) => f.severity === "must").length}</span></button>
          <button>Should fix <span class="pill should">${findings.filter((f) => f.severity === "should").length}</span></button>
          <button>Consider</button>
          <button>Passed</button>
        </div>

        ${findings.map((finding, index) => `
          <article class="finding ${finding.severity}">
            <div class="finding-head">
              <div>
                <div class="finding-title">${finding.title}</div>
                <div class="category-row">
                  <span class="mini-chip">${finding.category}</span>
                  <span class="mini-chip">${finding.layerName}</span>
                </div>
              </div>
              <span class="pill ${finding.severity}">${severityLabel(finding.severity)}</span>
            </div>
            <p class="muted" style="line-height:1.45;margin:8px 0 10px">${finding.recommendation}</p>
            <div class="button-row">
              <button class="secondary" onclick="send('show-layer', { nodeId: '${finding.layerId}' })">Show</button>
              <button class="secondary" onclick="addFindingNote(${index})">Note</button>
              <button class="secondary" onclick="openFinding(${index})">Open</button>
            </div>
          </article>
        `).join("")}
      `;
    }

    function renderDetail() {
      const finding = state.detail;
      if (!finding) return;
      document.getElementById("detail-view").innerHTML = `
        <button class="detail-back" onclick="state.detail=null; render()">&lt;- Back to findings</button>
        <div class="finding-head">
          <h2 style="font-size:17px;line-height:1.2;margin:0">${finding.title}</h2>
          <span class="pill ${finding.severity}">${severityLabel(finding.severity)}</span>
        </div>
        <div class="category-row">
          <span class="mini-chip">${finding.category}</span>
          <span class="mini-chip">Confidence ${finding.confidence}</span>
          <span class="mini-chip">${finding.id}</span>
        </div>

        <div class="section">
          <div class="section-title">Evidence</div>
          <div class="evidence-box">
            ${finding.evidence.map((item) => `<div style="margin:5px 0">${item}</div>`).join("")}
          </div>
        </div>

        <div class="section">
          <div class="section-title">Why it matters</div>
          <p class="muted" style="line-height:1.55">${finding.why}</p>
        </div>

        <div class="section">
          <div class="section-title">Recommended design response</div>
          <p style="line-height:1.55">${finding.recommendation}</p>
        </div>

        <div class="section checklist">
          <div class="section-title">Checklist</div>
          <label><input type="checkbox" /> Define the primary action for this page</label>
          <label><input type="checkbox" /> Move secondary actions to a menu or neutral style</label>
          <label><input type="checkbox" /> Ensure consistent button hierarchy across similar pages</label>
          <label><input type="checkbox" /> Check responsive behavior</label>
        </div>

        <div class="button-row" style="grid-template-columns:1fr 1fr">
          <button class="secondary" onclick="send('show-layer', { nodeId: '${finding.layerId}' })">Show layer</button>
          <button class="secondary" onclick="send('create-note', { finding: state.detail })">Add annotation</button>
        </div>
        <button class="primary" style="margin-top:8px" onclick="state.detail=null; render()">Mark resolved</button>
      `;
    }

    function renderStates() {
      if (!state.audit) {
        document.getElementById("states-view").innerHTML = `<div class="callout">Run an audit first to review missing states.</div>`;
        return;
      }

      const pillClass = (value) => value === "Present" ? "pass" : value === "Missing" ? "must" : "should";
      document.getElementById("states-view").innerHTML = `
        <div class="section">
          <h2 style="font-size:18px;margin:0 0 6px">Missing states</h2>
          <p class="muted" style="line-height:1.45;margin:0">Check essential UI states across key SaaS patterns.</p>
        </div>
        <table>
          <thead>
            <tr><th>State</th><th>Table</th><th>Form</th><th>Billing</th></tr>
          </thead>
          <tbody>
            ${state.audit.states.map((row) => `
              <tr>
                <td>${row.name}</td>
                <td><span class="pill ${pillClass(row.table)}">${row.table}</span></td>
                <td><span class="pill ${pillClass(row.form)}">${row.form}</span></td>
                <td><span class="pill ${pillClass(row.billing)}">${row.billing}</span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        <div class="callout"><strong>Why this matters</strong><br />Essential states prevent user errors, build trust, and make handoff more complete.</div>
        <button class="primary" onclick="send('create-report', { data: state.audit })">Generate review summary</button>
      `;
    }

    function renderReport() {
      if (!state.audit) {
        document.getElementById("report-view").innerHTML = `<div class="callout">Run an audit first to generate a report.</div>`;
        return;
      }

      document.getElementById("report-view").innerHTML = `
        <div class="section">
          <h2 style="font-size:18px;margin:0 0 6px">Review summary</h2>
          <p class="muted" style="line-height:1.45;margin:0">Create a clean audit report frame beside your design for critique or handoff.</p>
        </div>
        <div class="card">
          <div class="muted">Frame</div>
          <div class="strong" style="font-size:14px;margin-top:4px">${state.audit.summary.frameName}</div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <span class="pill info">Score ${state.audit.score}</span>
            <span class="pill should">${state.audit.complexity}</span>
            <span class="pill neutral">${state.audit.findings.length} findings</span>
          </div>
          <div class="muted" style="margin-top:10px">${state.audit.mode || "Audit"}${state.audit.backendMessage ? ` - ${state.audit.backendMessage}` : ""}</div>
        </div>
        <div class="section" style="margin-top:16px">
          <div class="section-title">Top findings</div>
          ${state.audit.findings.map((finding) => `<div class="finding"><div class="finding-title">${finding.id} - ${finding.title}</div><div class="muted">${finding.recommendation}</div></div>`).join("")}
        </div>
        <button class="primary" onclick="send('create-report', { data: state.audit })">Create report frame</button>
      `;
    }

    function render() {
      renderTabs();
      const ids = ["audit-view", "running-view", "findings-view", "detail-view", "states-view", "report-view"];
      ids.forEach((id) => document.getElementById(id).classList.add("hidden"));

      if (state.detail) {
        document.getElementById("detail-view").classList.remove("hidden");
        renderDetail();
        return;
      }

      if (state.tab === "running") {
        document.getElementById("running-view").classList.remove("hidden");
        renderRunning();
        return;
      }

      const viewId = `${state.tab}-view`;
      document.getElementById(viewId).classList.remove("hidden");

      if (state.tab === "audit") renderAudit();
      if (state.tab === "findings") renderFindings();
      if (state.tab === "states") renderStates();
      if (state.tab === "report") renderReport();
    }

    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;

      if (message.type === "selection") {
        state.selection = message.payload;
        render();
      }

      if (message.type === "audit-result") {
        state.audit = message.payload;
        state.progress = 100;
        state.tab = "findings";
        render();
      }
    };

    render();
  </script>
</body>
</html>
